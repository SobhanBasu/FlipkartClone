<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let row = Number(prompt("Enter number of rows"))
        console.log(row, "rows")
        let column = Number(prompt("Enter number of columns"))
        console.log(column, "columns")



        let mid = Math.floor(column / 2)
        for (let i = 1; i <= row; i++)
            for (let j = 1; j <= column; j++) {
                if (i == 1 || j == 1 || j == column || i == mid) {
                    document.write("*")
                } else {
                    document.write("&nbsp;&nbsp")
                }
            }
        document.write("<br>")
    </script>
</body>

</html>
